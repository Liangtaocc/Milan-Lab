async function serveStatic(response, pathname) {
  const relativePath = pathname === '/' ? 'index.html' : decodeURIComponent(pathname.replace(/^\/+/, ''));
  const candidate = path.resolve(PUBLIC_DIR, relativePath);
  if (!candidate.startsWith(`${PUBLIC_DIR}${path.sep}`) && candidate !== path.join(PUBLIC_DIR, 'index.html')) {
    return sendError(response, 403, '禁止访问该路径。');
  }
  try {
    const body = await fs.readFile(candidate);
    response.writeHead(200, {
      'Content-Type': MIME_TYPES[path.extname(candidate).toLowerCase()] || 'application/octet-stream',
      'Content-Length': body.length,
      'Cache-Control': 'no-store',
      'X-Content-Type-Options': 'nosniff',
    });
    response.end(body);
  } catch (error) {
    if (error.code === 'ENOENT') return sendError(response, 404, '页面不存在。');
    throw error;
  }
}

const server = http.createServer(async (request, response) => {
  try {
    const url = new URL(request.url, `http://${request.headers.host || '127.0.0.1'}`);
    if (url.pathname.startsWith('/api/')) await apiHandler(request, response, url);
    else if (request.method === 'GET' || request.method === 'HEAD') await serveStatic(response, url.pathname);
    else sendError(response, 405, '不支持的请求方法。');
  } catch (error) {
    console.error(error);
    if (!response.headersSent) sendError(response, 400, error.message || '请求处理失败。');
    else response.end();
  }
});

function openBrowser(address) {
  if (process.env.BATKB_NO_BROWSER === '1') return;
  const child = process.platform === 'win32'
    ? spawn('cmd', ['/c', 'start', '', address], { detached: true, stdio: 'ignore' })
    : process.platform === 'darwin'
      ? spawn('open', [address], { detached: true, stdio: 'ignore' })
      : spawn('xdg-open', [address], { detached: true, stdio: 'ignore' });
  child.unref();
}

async function start() {
  await initialiseStore();
  let port = PORT_START;
  const listen = () => new Promise((resolve, reject) => {
    server.once('error', reject);
    server.listen(port, '127.0.0.1', () => { server.off('error', reject); resolve(); });
  });
  while (true) {
    try { await listen(); break; } catch (error) {
      if (error.code !== 'EADDRINUSE' || port >= PORT_START + 9) throw error;
      port += 1;
    }
  }
  const address = `http://127.0.0.1:${port}`;
  console.log(`\nBAT Archive Workbench 正在运行：${address}`);
  console.log('数据仅保存于当前目录的 data 文件夹。按 Ctrl+C 可停止服务。\n');
  openBrowser(address);
}

start().catch((error) => {
  console.error(`启动失败：${error.stack || error.message}`);
  process.exitCode = 1;
